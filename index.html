
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>My Cloud</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px;
      font: 16px system-ui, sans-serif;
      background: #111827; color: #f9fafb;
    }
    main { max-width: 760px; margin: auto; }
    h1 { font-size: 2rem; }
    .muted { color: #a5b4c8; }
    .panel {
      background: #1f2937; border: 1px solid #374151;
      border-radius: 16px; padding: 20px; margin: 16px 0;
    }
    input, button {
      font: inherit; padding: 12px; border-radius: 9px;
      margin: 5px 0; max-width: 100%;
    }
    input { width: 100%; background: #111827; color: white;
      border: 1px solid #4b5563; }
    button { cursor: pointer; border: 0; background: #93c5fd;
      color: #111827; font-weight: 600; }
    button:disabled { opacity: .5; }
    .file {
      padding: 14px 0; border-bottom: 1px solid #374151;
      overflow-wrap: anywhere;
    }
    .file-name { font-weight: 600; }
    a { color: #93c5fd; overflow-wrap: anywhere; }
    #status { overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>☁️ My Cloud</h1>
  <p class="muted">Your personal files, wherever you go.</p>

  <section class="panel" id="auth">
    <h2>Your account</h2>
    <form id="auth-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password" minlength="8" required>
      <button type="submit" id="login">Log in</button>
      <button type="button" id="signup">Create account</button>
    </form>
  </section>

  <section class="panel" id="storage" hidden>
    <p id="who" class="muted"></p>
    <button id="logout">Log out</button>

    <h2>Upload a file</h2>
    <input id="picker" type="file">
    <button id="upload">Upload file</button>

    <h2>My files</h2>
    <button id="refresh">Refresh</button>
    <div id="files"></div>
  </section>

  <p id="status" role="status" aria-live="polite">Ready.</p>
</main>

<script>
  const SUPABASE_URL = "YOUR_PROJECT_URL";
  const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";
  const BUCKET = "personal-files";
  const MAX_BYTES = 50 * 1024 * 1024;
  const LINK_SECONDS = 3600;

  const client = supabase.createClient(
    SUPABASE_URL, SUPABASE_KEY
  );
  const $ = id => document.getElementById(id);

  let user = null;
  let busy = false;

  function say(message) {
    $("status").textContent = message;
  }

  async function action(fn) {
    if (busy) return;
    busy = true;
    say("Please wait...");
    try {
      await fn();
    } catch (e) {
      say(e.message || "Something went wrong.");
    } finally {
      busy = false;
    }
  }

  async function refreshSession() {
    const { data, error } = await client.auth.getSession();
    if (error) throw error;

    user = data.session?.user || null;
    $("auth").hidden = !!user;
    $("storage").hidden = !user;

    if (user) {
      $("who").textContent = "Signed in as " + user.email;
      await listFiles();
    } else {
      $("files").replaceChildren();
    }
  }

  $("auth-form").addEventListener("submit", event => {
    event.preventDefault();
    action(async () => {
      const { error } = await client.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });
      if (error) throw error;
      await refreshSession();
      say("Successfully logged in.");
    });
  });

  $("signup").addEventListener("click", () => action(async () => {
    const { data, error } = await client.auth.signUp({
      email: $("email").value.trim(),
      password: $("password").value
    });
    if (error) throw error;

    if (data.session) {
      await refreshSession();
      say("Account created.");
    } else {
      say("Check your email to confirm your account, then log in.");
    }
  }));

  $("logout").addEventListener("click", () => action(async () => {
    const { error } = await client.auth.signOut();
    if (error) throw error;
    await refreshSession();
    say("Logged out.");
  }));

  $("upload").addEventListener("click", () => action(async () => {
    if (!user) throw Error("Please log in first.");

    const file = $("picker").files[0];
    if (!file) throw Error("Choose a file first.");
    if (file.size > MAX_BYTES)
      throw Error("The file must be 50 MB or smaller.");

    const safeName = file.name
      .replace(/[^a-zA-Z0-9._() -]/g, "_")
      .slice(0, 150) || "upload";
    const path = user.id + "/" + crypto.randomUUID() + "-" + safeName;

    const { error } = await client.storage
      .from(BUCKET)
      .upload(path, file, { upsert: false });

    if (error) throw error;
    $("picker").value = "";
    await listFiles();
    say("File uploaded successfully.");
  }));

  async function listFiles() {
    if (!user) return;

    const { data, error } = await client.storage
      .from(BUCKET)
      .list(user.id, {
        limit: 100,
        sortBy: { column: "name", order: "desc" }
      });

    if (error) throw error;

    const container = $("files");
    container.replaceChildren();

    for (const file of data || []) {
      if (!file.name || file.id == null) continue;

      const path = user.id + "/" + file.name;
      const item = document.createElement("div");
      item.className = "file";

      const name = document.createElement("p");
      name.className = "file-name";
      name.textContent = file.name;
      item.append(name);

      const share = document.createElement("button");
      share.textContent = "Create 1-hour share link";
      share.addEventListener("click", () => action(async () => {
        const { data, error } = await client.storage
          .from(BUCKET)
          .createSignedUrl(path, LINK_SECONDS);

        if (error) throw error;

        const link = data.signedUrl;
        const anchor = document.createElement("a");
        anchor.href = link;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        anchor.textContent = "Open shared file";
        item.append(anchor);

        try {
          await navigator.clipboard.writeText(link);
          say("Share link copied. It expires in one hour.");
        } catch {
          say("Link created. Use the Open shared file link.");
        }
      }));
      item.append(share);

      const del = document.createElement("button");
      del.textContent = "Delete";
      del.addEventListener("click", () => action(async () => {
        if (!confirm("Permanently delete " + file.name + "?")) return;

        const { error } = await client.storage
          .from(BUCKET)
          .remove([path]);

        if (error) throw error;
        await listFiles();
        say("File deleted.");
      }));
      item.append(del);

      container.append(item);
    }

    if (!container.children.length) {
      container.textContent = "No files yet. Upload your first file!";
    }
  }

  $("refresh").addEventListener("click", () => action(listFiles));

  client.auth.onAuthStateChange(() => {
    // Keep async session work outside the auth callback.
    Promise.resolve().then(() => refreshSession())
      .catch(e => say(e.message));
  });

  refreshSession().catch(e => say(e.message));
</script>
</body>
  </html>
